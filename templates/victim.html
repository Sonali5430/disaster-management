<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victim Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #E83B3B;
      --amber:  #F59E0B;
      --teal:   #0BBFBF;
      --dark:   #0D0F14;
      --card:   #1A1E2A;
      --border: rgba(255,255,255,0.07);
      --text:   #E8EAF0;
      --muted:  #6B7280;
      --input-bg: #111420;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(155,89,255,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,15,20,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 0;
    }

    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--teal);
      text-transform: uppercase;
      margin-right: auto;
      text-decoration: none;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-radius: 10px;
      border-bottom: none;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    nav a:hover { opacity: 0.85; transform: translateY(-1px); }
    nav a.active { outline: 2px solid rgba(255,255,255,0.35); }

    nav a .nav-icon {
      width: 28px; height: 28px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .ni-home      { background: #4F7EFF; }
    .ni-victim    { background: #9B59FF; }
    .ni-emergency { background: #E83B3B; }
    .ni-dashboard { background: #2563EB; }
    .ni-alerts    { background: #F59E0B; }
    .ni-resources { background: #10B981; }
    .ni-manage    { background: #EC4899; }
    .ni-analytics { background: #06B6D4; }
    .ni-query     { background: #1e3a5f; } 

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      padding: 3.5rem 3rem 2.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9B59FF;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero h1 span {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.25);
    }

    .hero-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(155,89,255,0.12);
      border: 1px solid rgba(155,89,255,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #9B59FF;
    }

    /* ── FORM CONTAINER ── */
    main {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem 4rem;
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid #9B59FF;
      border-radius: 20px;
      padding: 40px 44px;
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.45s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .form-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 18px;
    }

    .field-full { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input::placeholder { color: #3a3f50; }

    .field input:focus {
      border-color: #9B59FF;
      box-shadow: 0 0 0 3px rgba(155,89,255,0.12);
    }

    .submit-btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: #9B59FF;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .submit-btn:hover {
      background: #8344e6;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(155,89,255,0.3);
    }

    .submit-btn:active { transform: scale(0.99); }

    @media (max-width: 600px) {
      .form-card { padding: 28px 22px; }
      .field-grid { grid-template-columns: 1fr; }
      .hero { padding: 2rem 1.5rem 1.5rem; }
      nav a .nav-label { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="/">⬡ DisasterOps</a>
    <a href="/"><span class="nav-icon ni-home">🏠</span><span class="nav-label">Home</span></a>
    <a href="/victim" class="active"><span class="nav-icon ni-victim">👤</span><span class="nav-label">Victim</span></a>
    <a href="/request"><span class="nav-icon ni-emergency">🚨</span><span class="nav-label">Emergency</span></a>
    <a href="/dashboard"><span class="nav-icon ni-dashboard">📊</span><span class="nav-label">Dashboard</span></a>
    <a href="/alerts"><span class="nav-icon ni-alerts">🔔</span><span class="nav-label">Alerts</span></a>
    <a href="/resources"><span class="nav-icon ni-resources">📦</span><span class="nav-label">Resources</span></a>
    <a href="/manage_resources"><span class="nav-icon ni-manage">⚙️</span><span class="nav-label">Manage</span></a>
    <a href="/analytics"><span class="nav-icon ni-analytics">📈</span><span class="nav-label">Analytics</span></a>
    <a href="/query"><span class="nav-icon ni-query">🗄️</span><span class="nav-label">Query</span></a> 
  </nav>

  <div class="hero">
    <div>
      <div class="hero-eyebrow">Victim Management</div>
      <h1>Victim <span>Registration</span></h1>
    </div>
    <div class="hero-badge">👤 New entry</div>
  </div>

  <main>
    <div class="form-card">
      <div class="form-title">Register a Victim</div>
      <div class="form-subtitle">Fill in the details below to log a new victim into the system.</div>

      <form method="POST">
        <div class="field-grid">

          <div class="field">
            <label>Victim ID</label>
            <input type="number" name="victim_id" placeholder="e.g. 101" required>
          </div>

          <div class="field">
            <label>Name</label>
            <input type="text" name="name" placeholder="Full name" required>
          </div>

          <div class="field">
            <label>Age</label>
            <input type="number" name="age" placeholder="Age" required>
          </div>

          <div class="field">
            <label>Gender</label>
            <input type="text" name="gender" placeholder="Male / Female / Other" required>
          </div>

          <div class="field">
            <label>Contact</label>
            <input type="text" name="contact" placeholder="Phone number" required>
          </div>

          <div class="field">
            <label>Location ID</label>
            <input type="number" name="location_id" placeholder="e.g. 5" required>
          </div>

        </div>

        <button type="submit" class="submit-btn">Register Victim</button>
      </form>
    </div>
  </main>

</body>
</html>
